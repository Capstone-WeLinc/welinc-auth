events {
    worker_connections 1024;
}

http {
    sendfile on;
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Spec 0003, AC-18: CORS only for an exact list of web origins, never an echo of any Origin.
    # Local: the portal and the three system web apps (spec 0001 sections 1 and 2). S9 moves this
    # file to infra/gateway/ with the hosted origins.
    map $http_origin $cors_origin {
        default                 "";
        "http://localhost:8000" $http_origin;
        "http://localhost:8001" $http_origin;
        "http://localhost:8002" $http_origin;
        "http://localhost:8003" $http_origin;
    }
    # nginx leaves out a header whose value is empty, so an unknown origin gets no CORS headers
    map $cors_origin $cors_credentials {
        default "true";
        ""      "";
    }

    server {
        listen 3000;
        server_name localhost;

        # Auth Service
        location /auth {
            # The gateway answers CORS itself (AC-18); upstream CORS headers are dropped
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Vary;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials $cors_credentials always;
            add_header Vary Origin always;

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials $cors_credentials always;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type' always;
                add_header Access-Control-Max-Age 600 always;
                add_header Vary Origin always;
                return 204;
            }

            set $auth_backend http://auth-service:3001;
            proxy_pass $auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # VRMS Backend Service (Handles /vrms/repairs, /vrms/config, /vrms/mechanics)
        location /vrms {
            # Spec 0017, AC-14: uploads up to 25 MB plus the multipart overhead, and time for a queued HEIC conversion
            client_max_body_size 26m;
            proxy_read_timeout 120s;

            # The gateway answers CORS itself (AC-18); upstream CORS headers are dropped
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Vary;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials $cors_credentials always;
            add_header Vary Origin always;

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials $cors_credentials always;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type' always;
                add_header Access-Control-Max-Age 600 always;
                add_header Vary Origin always;
                return 204;
            }

            set $vrms_backend http://vrms-backend:3002;
            proxy_pass $vrms_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # VRMS Service Fallback (/repairs)
        location /repairs {
            # Spec 0017, AC-14: same upload limits as /vrms
            client_max_body_size 26m;
            proxy_read_timeout 120s;

            # The gateway answers CORS itself (AC-18); upstream CORS headers are dropped
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Vary;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials $cors_credentials always;
            add_header Vary Origin always;

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials $cors_credentials always;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type' always;
                add_header Access-Control-Max-Age 600 always;
                add_header Vary Origin always;
                return 204;
            }

            set $vrms_backend http://vrms-backend:3002;
            proxy_pass $vrms_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health Check
        location / {
            return 200 '{"status": "WeLinc API Gateway is running"}';
            add_header Content-Type application/json;
        }
    }
}
